name: behavior-driven
version: 1
description: Behavior-driven workflow - proposal → specs (Markdown structure with fenced Gherkin steps) → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between

      proposal and specs phases. Research existing specs before filling this in.

      Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -

      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: "specs/**/spec.md"
    description: Detailed specifications for the change (Markdown structure with fenced Gherkin steps)
    template: spec.md
    instruction: |
      Create `spec.md` spec files that define WHAT the system should do.

      Create one `spec.md` per capability listed in the proposal's Capabilities
      section. A spec.md is a standard OpenSpec Markdown spec: the STRUCTURE
      (capability, requirements, scenarios) is ordinary Markdown headings, and
      only the Given/When/Then STEPS live inside ```gherkin fences. Prose
      (context, rationale, links) may appear anywhere.

      This is what makes the spec valid OpenSpec — `openspec validate` and
      `openspec archive` read the headings. Anything inside a fence is
      invisible to OpenSpec, which is why no structure may live there.

      Paths:
      - New capabilities: use the exact kebab-case name from the proposal
        (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from
        openspec/specs/<capability>/ when creating the delta spec at
        specs/<capability>/spec.md.

      Structure (how Markdown headings map onto Gherkin):
      - `# <capability>` — the H1 title. EXACTLY ONE per spec.md. Becomes
        `Feature:`.
      - `## ADDED|MODIFIED|REMOVED|RENAMED Requirements` — delta sections, in a
        change's delta spec. In openspec/specs/ (source of truth) these are
        instead `## Purpose` (a paragraph of at least 50 characters) followed
        by `## Requirements`.
      - `### Requirement: <name>` — one requirement. Becomes `Rule:`. The line
        directly beneath it is the normative description and MUST contain
        SHALL or MUST (avoid should/may). It must be plain prose, NOT inside a
        fence — OpenSpec cannot see fenced text.
      - `#### Scenario: <name>` — a concrete example. Becomes `Scenario:`.
        (`#### Scenario Outline: <name>` is also supported.)
      - Every `### Requirement:` MUST have at least one `#### Scenario:`.

      Fence contract (the extractor and the acceptance-test runner depend on it):
      - Steps go in fences opened by ```gherkin at column 0 (info string
        exactly `gherkin`, nothing more) and closed by ``` at column 0. An
        indented ```gherkin fence is a hard extraction error; gherkin quoted
        inside any other fence is treated as prose.
      - Each `#### Scenario:` heading MUST be followed by a gherkin fence
        before the next heading.
      - A fence contains ONLY steps (Given/When/Then/And/But), plus
        `Examples:` tables and docstrings. Writing `Feature:`, `Rule:`,
        `Scenario:` or `Scenario Outline:` inside a fence is a hard error —
        that structure comes from the headings.
      - Feature-level `Background:` goes under a `## Background` section with
        its own fence.

      Delta operations are the `## ... Requirements` section headings; there
      are no marker comments. Every requirement under a section takes that
      section's operation:
      - `## ADDED Requirements` — new requirements (full requirement +
        scenarios)
      - `## MODIFIED Requirements` — changed behavior (the FULL updated
        requirement + all scenarios, not a partial edit)
      - `## REMOVED Requirements` — deprecated requirements (the
        `### Requirement: <name>` heading naming each one is enough)
      - `## RENAMED Requirements` — name changes only, as FROM/TO bullet
        pairs:
          - FROM: `### Requirement: <old name>`
          - TO: `### Requirement: <new name>`

      MODIFIED workflow: locate the existing `### Requirement:` in
      openspec/specs/<capability>/spec.md, copy the ENTIRE block (description
      through all scenarios) into the `## MODIFIED Requirements` section, and
      edit. Partial MODIFIED content loses detail at archive time — if adding
      new concerns without changing existing behavior, use ADDED instead.

      Example delta spec.md:

      ````markdown
      # User authentication

      Login is being tightened: accounts must verify their email address
      before they may log in. See proposal.md for motivation.

      ## ADDED Requirements

      ### Requirement: Email must be verified before login
      Unverified accounts MUST NOT be able to log in to the system.

      #### Scenario: Unverified user is blocked

      ```gherkin
      Given an account with an unverified email address
      When the user attempts to log in
      Then access is denied
      ```

      ## REMOVED Requirements

      ### Requirement: Session expires after inactivity

      ## RENAMED Requirements

      - FROM: `### Requirement: Password must meet complexity requirements`
      - TO: `### Requirement: Password complexity is enforced`
      ````

      Specs should be testable - each scenario is a potential test case. The
      whole document renders normally on GitHub; the headings plus their
      fences are exactly what the acceptance suite executes.

      Before considering a spec complete, extract the Gherkin and lint it with
      gherkin-lint, fixing every reported issue. Linting is the same for every
      stack, so a spec that lints clean does so regardless of which runner the
      project uses. See the acceptance-test-authoring skill for your stack's
      extraction + lint commands and their required flags.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.


      **IMPORTANT: Follow the template below exactly.** The apply phase parses

      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.


      Guidelines:

      - Group related tasks under ## numbered headings

      - Each task MUST be a checkbox: `- [ ] X.Y Task description`

      - Tasks should be small enough to complete in one session

      - Order tasks by dependency (what must be done first?)


      The template's first-time-setup section is written against whichever

      acceptance stack the project uses. Read `stack:` from
      `openspec/config.yaml`

      (`javascript` or `python`) and substitute it wherever the template says

      `<stack>`, inlining the concrete destination filenames from that stack's

      "Files to copy" table in the acceptance-test-authoring skill

      (`references/<stack>/SETUP.md`). The authored tasks.md must name real

      filenames, not placeholders. If `stack:` is absent, task 1.1 records it

      first — do not guess it.


      Example:

      ```

      ## 1. Setup


      - [ ] 1.1 Create new module structure

      - [ ] 1.2 Add dependencies to package.json


      ## 2. Core Implementation


      - [ ] 2.1 Implement data export function

      - [ ] 2.2 Add CSV formatting utilities

      ```


      Reference specs for what needs to be built, design for how to build it.

      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.